name: demo-images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/demo-images.yml'

permissions:
  contents: read

# ---------------------------------------------------------------------------
# PUBLISHING IS MANUAL, ON A MAC
# ---------------------------------------------------------------------------
# GitHub has no FreeBSD runner on any architecture, and hosted runners have no
# nested virtualisation, so a FreeBSD guest here can only run under TCG
# emulation. Rather than publish images this CI cannot properly test, the demo
# images are built and pushed by a maintainer with jailmachine itself:
#
#     make -C demo build test push        # arm64, against the running machine
#
# This workflow is a signal-only check: it builds the two Linux images for
# both architectures (arm64 natively on ubuntu-24.04-arm) and smoke-tests
# them. It pushes nothing. When FreeBSD arm64/amd64 runners become available,
# add a publishing job here and drop the manual step from demo/README.md.
# ---------------------------------------------------------------------------

jobs:

  linux:
    name: linux/${{ matrix.arch }} ${{ matrix.image }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [linuxulator, nginx-linuxulator]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: build ${{ matrix.image }} for linux/${{ matrix.arch }}
        run: |
          docker build --pull \
            -t demo-smoke:${{ matrix.arch }} \
            -f demo/${{ matrix.image }}/Containerfile \
            demo/${{ matrix.image }}

      - name: smoke test
        # Native architecture on both runners, so no emulation: the entrypoint
        # really runs. It still runs on a Linux kernel, not the Linuxulator --
        # the real check is "make -C demo test" on a Mac with jailmachine.
        run: |
          case "${{ matrix.image }}" in
            nginx-*)
              id=$(docker run -d -p 8080:80 demo-smoke:${{ matrix.arch }})
              for _ in $(seq 1 30); do
                curl -fsS http://127.0.0.1:8080/healthz >/dev/null && ok=1 && break
                sleep 1
              done
              docker logs "$id" | tail -20
              docker rm -f "$id" >/dev/null
              [ "${ok:-0}" = 1 ] || { echo "::error::${{ matrix.image }} did not answer /healthz"; exit 1; }
              ;;
            *)
              docker run --rm demo-smoke:${{ matrix.arch }}
              ;;
          esac
