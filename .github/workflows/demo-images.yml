name: demo-images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/demo-images.yml'

permissions:
  contents: read
  packages: write

# ---------------------------------------------------------------------------
# PUBLISHING IS MANUAL, ON A MAC
# ---------------------------------------------------------------------------
# GitHub has no FreeBSD runner on any architecture, and hosted runners have no
# nested virtualisation, so a FreeBSD guest here can only run under TCG
# emulation. Rather than publish images this CI cannot properly test, the demo
# images are built and pushed by a maintainer with jailmachine itself:
#
#     make -C demo build test push        # arm64, against the running machine
#
# This workflow is a signal-only check: it builds the two Linux images for
# both architectures (arm64 natively on ubuntu-24.04-arm) and smoke-tests
# them. It pushes nothing. When FreeBSD arm64/amd64 runners become available,
# add a publishing job here and drop the manual step from demo/README.md.
# ---------------------------------------------------------------------------

jobs:

  linux:
    name: linux/${{ matrix.arch }} ${{ matrix.image }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [linuxulator, nginx-linuxulator]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: build ${{ matrix.image }} for linux/${{ matrix.arch }}
        run: |
          docker build --pull \
            -t demo-smoke:${{ matrix.arch }} \
            -f demo/${{ matrix.image }}/Containerfile \
            demo/${{ matrix.image }}

      - name: smoke test
        # Native architecture on both runners, so no emulation: the entrypoint
        # really runs. It still runs on a Linux kernel, not the Linuxulator --
        # the real check is "make -C demo test" on a Mac with jailmachine.
        run: |
          case "${{ matrix.image }}" in
            nginx-*)
              id=$(docker run -d -p 8080:80 demo-smoke:${{ matrix.arch }})
              for _ in $(seq 1 30); do
                curl -fsS http://127.0.0.1:8080/healthz >/dev/null && ok=1 && break
                sleep 1
              done
              docker logs "$id" | tail -20
              docker rm -f "$id" >/dev/null
              [ "${ok:-0}" = 1 ] || { echo "::error::${{ matrix.image }} did not answer /healthz"; exit 1; }
              ;;
            *)
              docker run --rm demo-smoke:${{ matrix.arch }}
              ;;
          esac

  # -------------------------------------------------------- freebsd (cross) --
  # No FreeBSD runner exists, but these two images have no RUN steps (they are
  # FROM + COPY --chmod + ENTRYPOINT), so buildah on Linux can assemble them
  # for freebsd/amd64 and freebsd/arm64 without executing anything. Pushing
  # from Actions with GITHUB_TOKEN links the package to this repository, which
  # is also what makes it inherit the repository's public visibility.
  #
  # jm-demo-nginx-native runs "pkg install" and therefore still needs a real
  # FreeBSD userland: it is published by hand with "make -C demo push".
  freebsd-crossbuild:
    name: freebsd ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [freebsd, volume]
    steps:
      - uses: actions/checkout@v5

      - name: build freebsd/amd64 and freebsd/arm64
        # vfs, not overlay: buildah's overlay driver stamps
        # user.overlay.impure / user.overlay.origin onto directory entries,
        # and the empty origin value makes podman on FreeBSD panic while
        # applying the layer (ExtattrSetLink, index out of range). vfs writes
        # no xattrs, so the layers stay portable to the guest.
        env:
          STORAGE_DRIVER: vfs
        run: |
          set -eux
          img=ghcr.io/${{ github.repository_owner }}/jm-demo-${{ matrix.image }}
          buildah manifest create "$img:ci"
          for arch in amd64 arm64; do
            buildah bud --os freebsd --arch "$arch" \
              --manifest "$img:ci" \
              -f demo/${{ matrix.image }}/Containerfile \
              demo/${{ matrix.image }}
          done
          buildah manifest inspect "$img:ci" | head -40

      - name: push
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STORAGE_DRIVER: vfs
        run: |
          set -eu
          img=ghcr.io/${{ github.repository_owner }}/jm-demo-${{ matrix.image }}
          echo "$TOKEN" | buildah login -u '${{ github.actor }}' --password-stdin ghcr.io
          buildah manifest push --all "$img:ci" "docker://$img:latest"
          buildah manifest push --all "$img:ci" "docker://$img:$(date -u +%Y%m%d)"

  # ------------------------------------------------- freebsd (bootstrap) ----
  # jm-demo-nginx-native runs "pkg install" and cannot be built without a
  # FreeBSD kernel, so a maintainer pushes it from a Mac. A package first
  # created by a personal token is private and unconnected, and an unconnected
  # package cannot be made public. Pushing a placeholder :bootstrap tag from
  # Actions creates the package with GITHUB_TOKEN instead: that connects it to
  # this repository and gives it the repository's visibility. The manual push
  # then only adds tags to a package that is already public.
  freebsd-bootstrap:
    name: bootstrap ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        image: [nginx-native]
    steps:
      - uses: actions/checkout@v5

      - name: push the :bootstrap placeholder
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STORAGE_DRIVER: vfs
        run: |
          set -eux
          img=ghcr.io/${{ github.repository_owner }}/jm-demo-${{ matrix.image }}
          buildah manifest create "$img:ci"
          for arch in amd64 arm64; do
            buildah bud --os freebsd --arch "$arch" \
              --build-arg IMAGE=${{ matrix.image }} \
              --manifest "$img:ci" demo/bootstrap
          done
          echo "$TOKEN" | buildah login -u '${{ github.actor }}' --password-stdin ghcr.io
          buildah manifest push --all "$img:ci" "docker://$img:bootstrap"
