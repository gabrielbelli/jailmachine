name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # ubuntu builds and unit-tests everything (no backend runs there).
    # macos-15 is Apple Silicon, but GitHub's arm64 macOS runners are
    # themselves VMs without nested virtualisation: HVF is unavailable, so
    # QEMU cannot boot the guest and the e2e test (make e2e, JM_E2E=1)
    # cannot run in CI. It stays a local, pre-release step (CONTRIBUTING.md).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: unit tests
        run: go test ./...
      - name: cross-compile build-only targets
        if: runner.os == 'Linux'
        run: |
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/jm
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/jm
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/jm
      - name: jm version / no-backend message
        if: runner.os == 'Linux'
        # Linux is build-only: init must fail with a clear message, not a
        # stack trace or a qemu lookup error.
        run: |
          go run ./cmd/jm version
          set +e
          out=$(go run ./cmd/jm --state-root "$RUNNER_TEMP/jm" init 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0
          echo "$out" | grep -q "no backend for this platform yet"

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
