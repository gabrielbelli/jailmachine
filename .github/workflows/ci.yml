name: ci

on:
  # Every branch, not just main: a branch is where a workflow change can be
  # proved before it is merged, and where the release dry run below is
  # actually useful.
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

# A push and its pull_request event share a group, so a PR branch does not
# run the whole matrix twice: head_ref is the bare branch name on a
# pull_request and empty on a push, where ref_name is that same bare name
# (github.ref would be "refs/heads/<branch>", which never collides).
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit:
    # ubuntu builds and unit-tests everything (no backend runs there).
    # macos-15 is Apple Silicon, but GitHub's arm64 macOS runners are
    # themselves VMs without nested virtualisation: HVF is unavailable, so
    # QEMU cannot boot the guest and the e2e test (make e2e, JM_E2E=1)
    # cannot run in CI. It stays a local, pre-release step (CONTRIBUTING.md).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: unit tests
        run: go test ./...
      # The resolver is the most concurrent thing here (a DNS server with a
      # goroutine per datagram, a TCP listener and an alias table refreshed
      # in the background), so the race detector is not optional: a fixture
      # race would otherwise hide a real one.
      - name: unit tests (race detector)
        run: go test -race ./...
      - name: cross-compile build-only targets
        if: runner.os == 'Linux'
        run: |
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/jm
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/jm
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/jm
      - name: jm version / no-backend message
        if: runner.os == 'Linux'
        # Linux is build-only: init must fail with a clear message, not a
        # stack trace or a qemu lookup error.
        run: |
          go run ./cmd/jm version
          set +e
          out=$(go run ./cmd/jm --state-root "$RUNNER_TEMP/jm" init 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0
          echo "$out" | grep -q "no backend for this platform yet"

  goreleaser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  # Runs .github/workflows/release.yml itself, in dry-run mode: real builds,
  # real archives, real changelog, real "is the Homebrew secret there?"
  # decision -- but --skip=publish, so nothing is uploaded and no tag is
  # needed. This is what stops a release.yml change from being discovered
  # only when a tag is pushed, which is how the v0.1.0 release broke.
  release-dry-run:
    # Skipped for pull requests from forks: their GITHUB_TOKEN is capped at
    # read, and a caller that grants less than the called workflow requests
    # is a startup failure ("is requesting 'contents: write', but is only
    # allowed 'contents: read'"), not a skipped job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # release.yml declares contents:write because a real release creates one.
    # A reusable workflow may not request more than its caller grants, so the
    # grant is repeated here even though dry_run publishes nothing.
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      dry_run: true
    secrets: inherit
