# nginx.conf for jm-demo-nginx-native
#
# The FreeBSD twin of demo/nginx-linuxulator: same site, same URLs, same
# nginx -- but this one is the FreeBSD port, an aarch64 FreeBSD ELF binary
# talking to the kernel directly.
#
# Note what is NOT here: no accept_mutex workaround. Native nginx uses
# kqueue(2), so the EPOLLEXCLUSIVE problem that breaks the Linux build
# simply does not exist. This is the whole point of the side-by-side.

user  www;
worker_processes  auto;

error_log  /dev/stderr  notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    # use kqueue;  <- the default on FreeBSD; spelled out here only as a note
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log  /dev/stdout;
    sendfile    on;
    keepalive_timeout  65;

    client_body_temp_path  /var/tmp/nginx/client_body;
    proxy_temp_path        /var/tmp/nginx/proxy;
    fastcgi_temp_path      /var/tmp/nginx/fastcgi;
    uwsgi_temp_path        /var/tmp/nginx/uwsgi;
    scgi_temp_path         /var/tmp/nginx/scgi;

    server {
        listen       80;
        server_name  _;
        root         /usr/local/www/nginx;
        index        index.html;

        location = /whoami.txt { default_type text/plain; }
        location = /healthz    { default_type text/plain; return 200 "ok\n"; }
    }
}
