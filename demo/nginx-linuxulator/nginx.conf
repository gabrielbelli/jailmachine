# nginx.conf for jm-demo-nginx-linuxulator
#
# =========================================================================
#  THE ONE LINE THAT MATTERS IS `accept_mutex on;` IN THE events BLOCK.
# =========================================================================
#
# Stock `nginx:alpine` does NOT work under FreeBSD's Linuxulator. Every
# worker dies immediately at startup:
#
#     [alert] 8231#8231: epoll_ctl(1, 6) failed (22: Invalid argument)
#     [alert] 8154#8154: worker process 8231 exited with fatal code 2
#                        and cannot be respawned
#
# Why: since 1.11.3 nginx defaults to `accept_mutex off`, and when it has
# more than one worker it adds the *listening* socket to epoll with the
# EPOLLEXCLUSIVE flag (ngx_event.c, guarded by `worker_processes > 1`) so
# the workers do not thundering-herd on accept(). FreeBSD's linux_epoll
# emulation does not implement EPOLLEXCLUSIVE and returns EINVAL, which
# nginx treats as fatal.
#
# Turning accept_mutex back on takes the older code path: nginx serialises
# accept() with a mutex instead of asking the kernel to do it, and never
# sets EPOLLEXCLUSIVE. Workers stay up, all of them.
#
# Verified on jailmachine (FreeBSD 15.1-RELEASE-p2 arm64, nginx 1.31.4):
#   worker_processes 4 + accept_mutex off  ->  workers die, connection refused
#   worker_processes 4 + accept_mutex on   ->  HTTP 200, 4 workers alive
#   worker_processes 1 + accept_mutex off  ->  HTTP 200 (EPOLLEXCLUSIVE is
#                                              only used when workers > 1)
#
# `use poll;` / `use select;` do NOT work: the official nginx images are
# built with epoll available, and nginx's configure then omits the poll and
# select event modules entirely. You get:
#   [emerg] invalid event type "poll" in /etc/nginx/nginx.conf
#
# Everything else below is ordinary nginx configuration.

user  nginx;
worker_processes  auto;

error_log  /dev/stderr  notice;
pid        /run/nginx.pid;

events {
    # --- the fix ---------------------------------------------------------
    # Avoids EPOLLEXCLUSIVE, which FreeBSD's linux_epoll rejects with EINVAL.
    accept_mutex  on;
    # ---------------------------------------------------------------------
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /dev/stdout;
    sendfile    on;      # works fine under the Linuxulator
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # Written at container start by entrypoint.sh -- real runtime facts,
        # not baked-in build-time strings.
        location = /whoami.txt { default_type text/plain; }

        location = /healthz { default_type text/plain; return 200 "ok\n"; }
    }
}
